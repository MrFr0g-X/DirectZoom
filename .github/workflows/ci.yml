name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Rust (rustup ships with the runner)
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/dzcap

      - name: Install dependencies
        run: npm ci

      # Electron downloads its binary on first use; fetch it once here so parallel tests
      # never race to unpack it.
      - name: Download Electron
        run: npx install-electron --no

      - name: Type-check and build the interface
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Build the capture helper
        run: npm run native
